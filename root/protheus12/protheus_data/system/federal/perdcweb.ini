?{"Nome do Arquivo INI","PERDCWEB.INI"}
?{"Descrição Completa do Arquivo Magnético","Pedido Eletrônico de Restituição ou Ressarcimento e Declaração de Compensação de IPI - Layout PER/DCOMP Web."}
?{"A Quem se Destina","Ao estabelecimento matriz da pessoa jurídica contribuinte do IPI que deseja solicitar ressarcimento de créditos, utilizando o ambiente PER/DCOMP Web para importação em lote do Registro R13 (Notas Fiscais de Entrada/Aquisição)."}
?{"Objetivo","Gerar o Registro R13 consolidado por chave FILIAL+NF+SÉRIE+CFOP."}
?{"Prazo de Entrega","Conforme necessidade de ressarcimento."}
?{"Aplicativo Disponibilizado pelo Fisco","PER/DCOMP Web"}
?{"Versão do Aplicativo Contemplada pela Microsiga","Web"}
?{"Comentários","Salvar na pasta \\system\\ do Protheus. Selecionar PERDCWEB na rotina MATA950. O arquivo PERDCOMP.INI permanece intacto para uso legado com o PGD."}

[SM0 Montagem de Arquivo ATI]
(PRE) _aTotal[010] := {}
(PRE) _aTotal[011] := {}
(PRE) _aTotal[012] := {}
(PRE) lExitPFil := lAglFil
(PRE) _aTotal[090] := cFilAnt
(PRE) _cIpiObs13 := IIf(AllTrim(GetNewPar("MV_IPINOBS",""))=="SN","F3_IPIOBS","CAST(0 AS DECIMAL(14,2))")
(PRE) _aBind13 := {}
(PRE) AAdd(_aBind13, xFilial("SF3"))
(PRE) AAdd(_aBind13, DTOS(MV_PAR01))
(PRE) AAdd(_aBind13, DTOS(MV_PAR02))
(PRE) _cQry13Web := "SELECT F3_FILIAL, F3_NFISCAL, F3_SERIE, F3_CLIEFOR, F3_LOJA, F3_ESTADO, MIN(F3_EMISSAO) AS F3_EMISSAO, MIN(F3_ENTRADA) AS F3_ENTRADA, F3_CFO, SUM(F3_VALCONT) AS R13VCONT, SUM(F3_VALIPI) AS R13VIPI, SUM("+_cIpiObs13+") AS R13IOBS, MAX(F3_TIPO) AS F3_TIPO, MAX(F3_DTCANC) AS F3_DTCANC FROM "+RetSqlName("SF3")+" WHERE D_E_L_E_T_=' ' AND F3_FILIAL=? AND F3_ENTRADA>=? AND F3_ENTRADA<=? AND F3_VALIPI>0 GROUP BY F3_FILIAL, F3_NFISCAL, F3_SERIE, F3_CLIEFOR, F3_LOJA, F3_ESTADO, F3_CFO ORDER BY F3_FILIAL, F3_NFISCAL, F3_SERIE, F3_CFO"
(PRE) IIf(Select("QRY13WEB")==0, DbUseArea(.T., "TOPCONN", TCGenQry2(NIL, NIL, _cQry13Web, _aBind13), "QRY13WEB", .T., .T.), Nil)

[XXX Painel Principal]
(PRE) aAdd(_aTotal[010], "PER/DCOMP Web")
(PRE) aAdd(_aTotal[010], "")
(PRE) aAdd(_aTotal[010], "Pedido Eletrônico de Restituição ou Ressarcimento / Declaração de Compensação.")
(PRE) aAdd(_aTotal[010], "Informe o CNPJ da Empresa Sucedida e da Empresa Detentora do Crédito")

[SF1 Notas Fiscais de Entrada]
(PRE) DbSelectArea("SF1")
(PRE) SF1->(dbSetOrder(1))

[XXX Montagem do Wizard - CNPJ Sucedida e Detentora.]
(PRE) aAdd(_aTotal[011], {})
(PRE) aAdd(_aTotal[011][1], "PER/DCOMP Web")
(PRE) aAdd(_aTotal[011][1], "Caso o CNPJ do Detentor do Crédito não seja informado, o sistema assumirá o CNPJ do declarante.")
(PRE) aAdd(_aTotal[011][1], {})
(PRE) aAdd(_aTotal[011][1][3], {1, "CNPJ da Empresa Sucedida",,,,,,})
(PRE) aAdd(_aTotal[011][1][3], {1, "CNPJ Detentor de Crédito",,,,,,})
(PRE) aAdd(_aTotal[011][1][3], {2,,"@R 99.999.999/9999-99",1,,,,14})
(PRE) aAdd(_aTotal[011][1][3], {2,,"@R 99.999.999/9999-99",1,,,,14})
(PRE) aAdd(_aTotal[011][1][3], {1, "CNPJ da Empresa Declarante",,,,,,})
(PRE) aAdd(_aTotal[011][1][3], {0, "",,,,,,})
(PRE) aAdd(_aTotal[011][1][3], {2,,"@R 99.999.999/9999-99",1,,,,14})
(PRE) aAdd(_aTotal[011][1][3], {0, "",,,,,,})
(PRE) aAdd(_aTotal[011][1][3], {0, "",,,,,,})
(PRE) xMagWizard(_aTotal[010], _aTotal[011], "PERDCWEB")
(PRE) xMagLeWiz("PERDCWEB", @_aTotal[012], .T.)

// ============================================================
// Seção QRY13WEB: itera sobre a query consolidada aberta no
// (PRE) da seção SM0. A query já existe quando o MATA950
// chama DbSelectArea("QRY13WEB") ao entrar nesta seção.
// ============================================================
[QRY13WEB Notas Fiscais de Entrada - Consolidado Web]
(PRE) _aTotal[01] := {"QRY13WEB",""}
// Resolve os campos do wizard e SM0 UMA VEZ no (PRE), antes do loop de registros.
// _aTotal[020..023] são visíveis nos campos calculados (mesmo array global do INI).
// Type() e SM0->M0_CGC ficam fora do loop - zero overhead por registro.
// Posições 020-023 não são usadas por nenhuma outra seção deste INI.
(PRE) _aTotal[020] := IIf(Type("_aTotal[012][1]")=="A" .And. !Empty(_aTotal[012][1][3]), _aTotal[012][1][3], aFISFILL(Num2Chr(Val(SM0->M0_CGC),14,0),14))
(PRE) _aTotal[021] := IIf(Type("_aTotal[012][1]")=="A" .And. !Empty(_aTotal[012][1][1]), _aTotal[012][1][1], Space(14))
(PRE) _aTotal[022] := IIf(Type("_aTotal[012][1]")=="A" .And. !Empty(_aTotal[012][1][2]), _aTotal[012][1][2], aFISFILL(Num2Chr(Val(SM0->M0_CGC),14,0),14))
(PRE) _aTotal[023] := SM0->M0_CGC
(PRE) QRY13WEB->(DbGoTop())
(PREREG) cFilAnt := IIf(Empty(QRY13WEB->F3_FILIAL), cFilAnt, QRY13WEB->F3_FILIAL)
(PREREG) Substr(QRY13WEB->F3_CFO,1,1) < "5"
(PREREG) Empty(QRY13WEB->F3_DTCANC)
(PREREG) IIf(!QRY13WEB->F3_TIPO$"DB",SA2->(MsSeek(xFilial("SA2")+QRY13WEB->F3_CLIEFOR+QRY13WEB->F3_LOJA)),SA1->(MsSeek(xFilial("SA1")+QRY13WEB->F3_CLIEFOR+QRY13WEB->F3_LOJA)))
(PREREG) IIf(!QRY13WEB->F3_TIPO$"DB","J"$SA2->A2_TIPO,"J"$SA1->A1_PESSOA) .Or. QRY13WEB->F3_ESTADO=="EX"
(PREREG) SF1->(MsSeek(xFilial("SF1")+QRY13WEB->F3_NFISCAL+QRY13WEB->F3_SERIE+QRY13WEB->F3_CLIEFOR+QRY13WEB->F3_LOJA))
TIPO       C 003 0 "R13"
CNPJEmp    C 014 0 _aTotal[020]
CNPJSuce   C 014 0 _aTotal[021]
CNPJDet    C 014 0 _aTotal[022]
CNPJ       C 014 0 IIf(QRY13WEB->F3_ESTADO=="EX" .OR. (SF1->F1_FORMUL=="S" .AND. SF1->F1_DEVMERC=="S"),_aTotal[023],IIF(!QRY13WEB->F3_TIPO$"DB",SA2->A2_CGC,SA1->A1_CGC))
NmDoc      C 009 0 RetNf(QRY13WEB->F3_NFISCAL,9,"N")
SerSubDoc  C 003 0 SerieNfId("QRY13WEB",2,"F3_SERIE")
DtEmissao  C 008 0 DataInt(STOD(QRY13WEB->F3_EMISSAO))
DtEntrada  C 008 0 DataInt(STOD(QRY13WEB->F3_ENTRADA))
CFOP       C 004 0 AllTrim(QRY13WEB->F3_CFO)
ValTotal   N 014 2 QRY13WEB->R13VCONT
ValIPIDest N 014 2 QRY13WEB->R13VIPI+QRY13WEB->R13IOBS
ValIPICred N 014 2 QRY13WEB->R13VIPI
(POS) QRY13WEB->(DbCloseArea())
(POS) cFilAnt := _aTotal[090]